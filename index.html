<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Up</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Level Up">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Orbitron:wght@600&family=Rajdhani:wght@500;700&family=Righteous&family=Nunito:wght@400;700&family=Inter:wght@400;600&family=Alfa+Slab+One&family=Zilla+Slab:wght@400;600&family=VT323&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  color-scheme: dark;
  --page: #000300;
  --page-ink: #39ff7a;
  --win: #03120a;
  --win2: #000502;
  --frame: #00ff66;
  --frame-out: #00330f;
  --ink: #d2ffe0;
  --muted: #5fc584;
  --well: #001a0b;
  --gold: #39ff7a;
  --gold-d: #00b84a;
  --red: #ff2a4d;
  --green: #39ff7a;
  --c-fitness: #ff3b5c;
  --c-study: #39ff7a;
  --c-productivity: #c6ff3b;
  --c-work: #00ffc8;
  --c-sleep: #ff8fa3;
  --px: 'Press Start 2P', 'Courier New', monospace;
  --body: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --k: 1;
  --bs: 16px;
  --bw: 2px;
  --radius: 4px;
  --hw: 400;
  --page-bg: var(--page);
  --win-shadow: 0 0 14px color-mix(in srgb, var(--frame) 40%, transparent), inset 0 0 22px color-mix(in srgb, var(--frame) 10%, transparent);
  --nav-shadow: 0 -4px 16px color-mix(in srgb, var(--frame) 30%, transparent);
  --tglow: 0 0 14px var(--gold), 0 0 3px var(--gold);
  --tglow-page: 0 0 8px var(--page-ink);
  --on-gold: #001a07;
  --red-bg: #2a0009;
  --on-red: #ffd3db;
  --btn-glow: 0 0 12px color-mix(in srgb, var(--gold) 60%, transparent);
  --btn-glow-red: 0 0 12px color-mix(in srgb, var(--red) 55%, transparent);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #000300;
    --page-ink: #39ff7a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #000300;
  --page-ink: #39ff7a;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--page-ink);
  font-family: var(--body);
  font-size: var(--bs);
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
svg.lucide { width: 18px; height: 18px; stroke-width: 2.25; flex: none; vertical-align: -3px; }

.backdrop { position: fixed; inset: 0; z-index: 0; background: var(--page-bg); pointer-events: none; }
:root:not([data-skin="matrix"]) #rain { display: none; }
#rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .3; pointer-events: none; }
main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 10px 14px 120px; }
.topbar h1 { text-shadow: var(--tglow-page); }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 2px; }
.topbar h1 { font-family: var(--px); font-weight: var(--hw); font-size: calc(13px * var(--k)); margin: 0; letter-spacing: .04em; }
.topbar .date { font-size: 15px; opacity: .75; }

.win {
  position: relative;
  background: linear-gradient(180deg, var(--win), var(--win2));
  color: var(--ink);
  border: var(--bw) solid var(--frame);
  border-radius: var(--radius);
  box-shadow: var(--win-shadow);
  padding: 14px 14px 12px;
  margin: 18px 3px;
}
.win h2 {
  font-family: var(--px);
  font-size: calc(11px * var(--k));
  font-weight: var(--hw);
  line-height: 1.5;
  color: var(--gold);
  margin: 0 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.win h2 .aside { margin-left: auto; font-family: var(--body); font-size: 14px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
p { margin: 6px 0; }

.hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.lv { font-family: var(--px); color: var(--gold); font-size: 46px; line-height: 1; text-shadow: var(--tglow); text-align: center; min-width: 92px; }
.lv small { display: block; font-size: calc(11px * var(--k)); color: var(--ink); text-shadow: none; margin-bottom: 8px; }
.hero .title { font-family: var(--px); font-weight: var(--hw); font-size: calc(10px * var(--k)); line-height: 1.6; margin-bottom: 8px; }

.bar { height: 16px; background: var(--well); border: 2px solid var(--frame); border-radius: 2px; position: relative; overflow: hidden; }
.bar > span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--fill, var(--gold)) 0 9px, color-mix(in srgb, var(--fill, var(--gold)) 70%, #000) 9px 11px); transition: width .5s steps(8); }
.bar.thin { height: 10px; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); margin-top: 5px; }

.week-num { font-family: var(--px); font-size: 22px; color: var(--ink); }
.week-num small { font-family: var(--body); font-size: 15px; color: var(--muted); margin-left: 6px; }
.track { position: relative; margin: 14px 0 26px; }
.track .mark { position: absolute; top: -4px; width: 3px; height: 24px; background: var(--frame); transform: translateX(-1px); }
.track .mark b { position: absolute; top: 27px; left: 50%; transform: translateX(-50%); font-weight: 400; font-size: 12px; color: var(--muted); white-space: nowrap; }
.track .mark.hit b { color: var(--gold); }

.row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-top: 2px dashed color-mix(in srgb, var(--frame) 22%, transparent); }
.row:first-of-type { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .name { overflow-wrap: anywhere; }
.xp { font-family: var(--px); font-weight: var(--hw); font-size: calc(10px * var(--k)); color: var(--gold); white-space: nowrap; }
.xp.neg { color: var(--red); }
.cat-dot { width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; background: var(--well); color: var(--c, var(--ink)); border: 2px solid currentColor; flex: none; }
.cat-dot svg.lucide { width: 15px; height: 15px; }

.skill { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; }
.skill .bar { grid-column: 2 / 4; }
.skill .lvl { font-family: var(--px); font-size: calc(10px * var(--k)); }
.flame { color: var(--gold); font-size: 14px; white-space: nowrap; }

.taskbtn { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 8px; border-radius: 4px; cursor: pointer; }
.taskbtn:hover, .taskbtn:focus-visible { background: color-mix(in srgb, var(--frame) 10%, transparent); }
.taskbtn:focus-visible { outline: 3px solid var(--gold); }
.taskbtn::before { content: "▶"; font-size: 11px; color: var(--gold); opacity: 0; width: 10px; }
.taskbtn:hover::before, .taskbtn:focus-visible::before { opacity: 1; }
.taskbtn.pop { animation: pop .35s steps(3); }
@keyframes pop { 50% { background: color-mix(in srgb, var(--gold) 35%, transparent); } }
.taskbtn .grow { flex: 1; }
.quest-done .name { text-decoration: line-through; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 7px 14px;
  background: var(--well); color: var(--ink);
  border: 2px solid var(--frame); border-radius: min(var(--radius), 10px);
  box-shadow: 0 3px 0 var(--frame-out);
  font-size: 16px;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--frame-out); }
.btn.gold { background: var(--gold); color: var(--on-gold); border-color: var(--gold); box-shadow: var(--btn-glow); }
.btn.red { background: var(--red-bg); color: var(--on-red); border-color: var(--red); box-shadow: var(--btn-glow-red); }
.xp.neg, .cat-dot[style*="--red"] { text-shadow: 0 0 6px var(--red); }
.btn.icon { min-width: 40px; padding: 7px; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

.form { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 10px; }
.form.three { grid-template-columns: 1fr 1fr 84px; }
.form .full { grid-column: 1 / -1; }
input[type=text], input[type=number], input[type=datetime-local], input[type=time], select, textarea {
  width: 100%; min-height: 42px; padding: 8px 10px;
  background: var(--well); color: var(--ink);
  border: 2px solid color-mix(in srgb, var(--frame) 55%, transparent); border-radius: 4px;
  font-size: 16px;
}
input::placeholder { color: var(--muted); opacity: .8; }
label.lab { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }

.tag { font-size: 13px; padding: 1px 7px; border-radius: 3px; border: 1px solid currentColor; color: var(--c, var(--muted)); white-space: nowrap; }
.tier-bronze { --c: #e3a46b; } .tier-silver { --c: #d8deef; } .tier-gold { --c: var(--gold); }

.banner { display: flex; gap: 10px; align-items: center; }
.banner .grow { flex: 1; }

.day { font-family: var(--px); font-size: calc(9px * var(--k)); color: var(--muted); margin: 16px 0 4px; }
.day:first-child { margin-top: 0; }
.thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 3px; border: 2px solid var(--frame); cursor: pointer; display: block; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { text-align: center; padding: 10px 6px; border: 2px solid color-mix(in srgb, var(--frame) 35%, transparent); border-radius: 4px; background: var(--well); }
.badge .ico { color: var(--gold); margin-bottom: 4px; }
.badge .ico svg.lucide { width: 26px; height: 26px; }
.badge .bn { font-size: 14px; line-height: 1.2; }
.badge .bd { font-size: 12px; color: var(--muted); line-height: 1.25; margin-top: 3px; }
.badge.locked { opacity: .42; }
.badge.locked .ico { color: var(--muted); }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--win2);
  border-top: 3px solid var(--frame);
  box-shadow: var(--nav-shadow);
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); }
nav.tabs button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; color: var(--muted); font-size: 11px; line-height: 1.1; text-align: center; white-space: pre-line; position: relative; }
nav.tabs button svg.lucide { width: 21px; height: 21px; }
nav.tabs button[aria-current="page"] { color: var(--gold); }
nav.tabs button[aria-current="page"]::before { content: "▼"; position: absolute; top: -2px; font-size: 9px; }
nav.tabs button:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 14px; }
.toast { pointer-events: auto; max-width: 532px; width: 100%; margin: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; animation: rise .2s steps(3); }
.toast .grow { flex: 1; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }

.overlay { position: fixed; inset: 0; z-index: 40; background: rgb(0 4 1 / .82); display: grid; place-items: center; padding: 24px; }
.overlay .win { width: min(420px, 100%); margin: 0; }
.levelup { text-align: center; padding: 26px 18px 20px; overflow: hidden; }
.levelup .big { font-family: var(--px); font-size: 22px; color: var(--gold); text-shadow: 0 0 12px var(--gold); animation: blink .9s steps(2) 3; }
.levelup .num { font-family: var(--px); font-size: 64px; margin: 22px 0 12px; text-shadow: 0 0 18px var(--gold), 0 0 4px var(--gold); animation: drop .6s steps(6); }
.levelup p { color: var(--muted); }
.spark { position: absolute; width: 6px; height: 6px; background: var(--gold); animation: spark 1.1s steps(6) forwards; }
@keyframes blink { 50% { opacity: .2; } }
@keyframes drop { from { transform: translateY(-60px) scale(1.6); opacity: 0; } }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
.photo-view img { width: 100%; max-height: 70vh; object-fit: contain; display: block; border-radius: 3px; }

.chart { width: 100%; height: auto; display: block; overflow: visible; margin: 4px 0 6px; }
.chart .col { fill: var(--gold-d); }
.chart .hl { fill: var(--gold); filter: drop-shadow(0 0 4px var(--gold)); }
.chart .lbl { fill: var(--muted); font-family: var(--body); font-size: 11px; }
.chart .ref { stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .reft { fill: var(--red); font-family: var(--body); font-size: 10px; }
.chart .base { stroke: var(--frame); stroke-width: 1.5; }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 5px 0; font-size: 15px; }
.hrow .bar { grid-column: 1 / -1; }
.hval { color: var(--muted); }
h3.sub { font-family: var(--px); font-size: calc(9px * var(--k)); line-height: 1.5; color: var(--muted); margin: 18px 0 4px; font-weight: 400; }
.insight { border-left: 3px solid var(--red); padding: 8px 10px; background: color-mix(in srgb, var(--red) 12%, transparent); margin: 10px 0; }
.trig { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.tag.loot { color: var(--gold); margin-left: 6px; }
.tag.trig-tag { color: var(--red); margin-left: 6px; }
.frenzy { display: flex; gap: 10px; align-items: center; color: var(--gold); text-shadow: var(--tglow); }
.lootbox { text-align: center; padding: 26px 18px 20px; overflow: hidden; }
.lootbox .chest { color: var(--gold); display: inline-block; animation: shake .45s steps(4) 2, glow 1.1s ease-in-out .9s infinite alternate; }
.lootbox .chest svg.lucide { width: 68px; height: 68px; stroke-width: 1.75; }
.lootbox .kind { font-family: var(--px); font-size: 17px; line-height: 1.4; color: var(--gold); margin: 18px 0 6px; text-shadow: 0 0 12px var(--gold); }
.lootbox .amt { font-family: var(--px); font-size: 26px; margin: 14px 0; }
.lootbox.jackpot .kind, .lootbox.jackpot .chest { color: var(--red); text-shadow: 0 0 14px var(--red); }
@keyframes shake { 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
@keyframes glow { to { filter: drop-shadow(0 0 16px currentColor); } }

.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.cal-head .mname { font-family: var(--px); font-weight: var(--hw); font-size: calc(11px * var(--k)); color: var(--gold); text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.cal-day { all: unset; box-sizing: border-box; cursor: pointer; min-height: 48px; border-radius: min(var(--radius), 8px); background: var(--well); border: 1px solid color-mix(in srgb, var(--frame) 25%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 15px; line-height: 1; }
.cal-day .pip { font-size: 10px; color: var(--muted); min-height: 11px; display: flex; align-items: center; }
.cal-day .pip svg.lucide { width: 12px; height: 12px; stroke-width: 3; }
.cal-day.has { border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
.cal-day.done { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.cal-day.done .pip { color: var(--on-gold); }
.cal-day.missed .pip { color: var(--red); }
.cal-day.today { outline: 2px solid var(--gold); outline-offset: 1px; }
.cal-day:focus-visible { outline: 3px solid var(--gold); }
.check { all: unset; box-sizing: border-box; width: 30px; height: 30px; border: 2px solid var(--frame); border-radius: min(var(--radius), 6px); display: grid; place-items: center; cursor: pointer; flex: none; background: var(--well); }
.check.on { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.check:disabled { opacity: .45; cursor: default; }
.check:focus-visible { outline: 3px solid var(--gold); }
.check svg.lucide { width: 17px; height: 17px; stroke-width: 3; }
.struck { text-decoration: line-through; color: var(--muted); }
.back { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: var(--page-ink); font-size: 15px; padding: 8px 2px 0; }
.back:focus-visible { outline: 3px solid var(--gold); }

/* ---------- the System ---------- */
.sys-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sys-tag { font-family: var(--px); font-size: calc(9px * var(--k)); letter-spacing: .25em; color: var(--muted); }
.gold-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border: 1px solid var(--gold); border-radius: 99px; color: var(--gold); font-size: 15px; }
.sys-name { font-family: var(--px); font-weight: var(--hw); font-size: calc(11px * var(--k)); line-height: 1.4; margin-bottom: 6px; }
.sys-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 9px; }
.rank { font-family: var(--px); font-weight: var(--hw); font-size: calc(9px * var(--k)); padding: 4px 8px; border-radius: 3px; background: var(--well); border: 1px solid var(--gold); color: var(--gold); }
.rank-S, .rank-A { color: var(--red); border-color: var(--red); }
.title-btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; font-size: 15px; color: var(--muted); border-bottom: 1px dashed currentColor; }
.title-btn:focus-visible { outline: 3px solid var(--gold); }
.fatigue { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--muted); }
.stat { display: grid; grid-template-columns: 46px 30px 1fr auto; align-items: center; gap: 8px; min-height: 44px; border-top: 1px dashed color-mix(in srgb, var(--frame) 22%, transparent); }
.stat:first-child { border-top: 0; }
.stat b { font-family: var(--px); font-weight: var(--hw); font-size: calc(10px * var(--k)); color: var(--gold); }
.statval { font-family: var(--px); font-size: calc(12px * var(--k)); }
.win.pen { border-color: var(--red); box-shadow: 0 0 18px color-mix(in srgb, var(--red) 45%, transparent); }
.win.pen h2 { color: var(--red); }
.win.em { border-color: var(--gold); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 26px color-mix(in srgb, var(--gold) 65%, transparent); } }
.quest-text { font-size: 19px; line-height: 1.3; margin: 8px 0; }
.btn[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 3px 0; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale .btn { padding: 6px 0; min-height: 38px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .btn { min-height: 34px; padding: 4px 11px; font-size: 14px; }
textarea { min-height: 62px; resize: vertical; line-height: 1.35; }
.field { margin-top: 12px; }
.field .lab { margin-bottom: 5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tlrow { display: grid; grid-template-columns: 58px 1fr; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; color: var(--muted); }
.tl { position: relative; height: 16px; background: var(--well); border-radius: 3px; }
.tl span { position: absolute; top: 0; bottom: 0; background: var(--c-sleep); border-radius: 3px; }
.tl i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--gold); opacity: .7; }
.tl-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-left: 66px; }
.bigstat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 6px 0 4px; }
.bigstat b { display: block; font-family: var(--px); font-weight: var(--hw); font-size: calc(13px * var(--k)); color: var(--gold); margin-bottom: 4px; }
.bigstat span { font-size: 13px; color: var(--muted); }

<script>
/* Level Up — XP engine. Pure functions; no DOM, no storage. */
(function (root) {
  'use strict';

  const CATS = [
    { id: 'fitness', name: 'Fitness', icon: 'dumbbell' },
    { id: 'study', name: 'Study', icon: 'book-open' },
    { id: 'productivity', name: 'Productivity', icon: 'list-checks' },
    { id: 'work', name: 'Work', icon: 'briefcase' },
    { id: 'sleep', name: 'Sleep', icon: 'moon' }
  ];

  const TASKS = [
    { id: 't-run', cat: 'fitness', name: '30-min run or cardio', xp: 40 },
    { id: 't-lift', cat: 'fitness', name: 'Strength workout (45+ min)', xp: 50 },
    { id: 't-steps', cat: 'fitness', name: '10k steps', xp: 20 },
    { id: 't-stretch', cat: 'fitness', name: 'Stretching or mobility, 15 min', xp: 10 },
    { id: 't-study1', cat: 'study', name: '1-hour focused study', xp: 30 },
    { id: 't-study2', cat: 'study', name: '2-hour focused study', xp: 60 },
    { id: 't-read', cat: 'study', name: 'Read 20 pages', xp: 15 },
    { id: 't-bed', cat: 'productivity', name: 'Make bed', xp: 5 },
    { id: 't-inbox', cat: 'productivity', name: 'Clear inbox', xp: 10 },
    { id: 't-plan', cat: 'productivity', name: 'Plan tomorrow', xp: 10 },
    { id: 't-clean', cat: 'productivity', name: 'Clean room', xp: 15 },
    { id: 't-deep', cat: 'work', name: 'Deep work block (90 min)', xp: 45 },
    { id: 't-ship', cat: 'work', name: 'Ship a deliverable', xp: 50 }
  ];

  const TIERS = [
    { id: 'bronze', name: 'Bronze', xp: 800 },
    { id: 'silver', name: 'Silver', xp: 1200 },
    { id: 'gold', name: 'Gold', xp: 1700 }
  ];

  const SLIP_XP = 5;
  const JOURNAL_XP = 15;
  const PLAN_MULT = 2;
  const LOOT_CHANCE = 0.12;
  const FRENZY_MS = 3600000, FRENZY_MULT = 1.5, JACKPOT_XP = 250;
  const LOOT = [
    { kind: 'double', w: 45, name: 'Double XP' },
    { kind: 'bonus', w: 30, name: 'Bonus XP' },
    { kind: 'frenzy', w: 12, name: 'XP Frenzy' },
    { kind: 'triple', w: 10, name: 'Triple XP' },
    { kind: 'jackpot', w: 3, name: 'Jackpot' }
  ];

  /* Rolled once when a task is logged; the result is stored on the event so replays and undo stay exact. */
  function rollLoot(rand, ts, chance) {
    rand = rand || Math.random;
    if (rand() >= (chance || LOOT_CHANCE)) return null;
    let r = rand() * 100;
    for (const l of LOOT) {
      if (r < l.w) {
        if (l.kind === 'bonus') return { kind: 'bonus', amount: 15 + Math.floor(rand() * 61) };
        if (l.kind === 'frenzy') return { kind: 'frenzy', until: ts + FRENZY_MS };
        return { kind: l.kind };
      }
      r -= l.w;
    }
    return { kind: 'double' };
  }
  function applyLoot(x, loot) {
    if (!loot) return x;
    if (loot.kind === 'double') return x * 2;
    if (loot.kind === 'triple') return x * 3;
    if (loot.kind === 'bonus') return x + (loot.amount || 0);
    if (loot.kind === 'jackpot') return x + JACKPOT_XP;
    return x;
  }
  const QUEST_BONUS = 50;
  const STREAK_STEP = 0.05;
  const STREAK_MAX_DAYS = 5; // 5 × 5% = +25%
  const CUSTOM_MIN = 5, CUSTOM_MAX = 60;
  const DAY = 86400000;

  const pad = n => String(n).padStart(2, '0');

  function xpForNext(level) { return Math.round(100 * Math.pow(level, 1.5)); }

  function levelInfo(xp) {
    let level = 1, rem = Math.max(0, xp);
    while (rem >= xpForNext(level)) { rem -= xpForNext(level); level++; }
    return { level, into: rem, need: xpForNext(level) };
  }

  function dayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dayIndex(ts) {
    const d = new Date(ts);
    return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
  }
  function weekStart(ts) {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // Monday
    return d.getTime();
  }
  function weekKey(ts) { return dayKey(weekStart(ts)); }
  function prevWeekKey(ts) { return weekKey(weekStart(ts) - DAY); }

  function newState() {
    return {
      version: 1,
      events: [],
      customTasks: [],
      habits: [],
      rewards: [
        { id: 'r1', tier: 'bronze', name: 'Favourite takeaway' },
        { id: 'r2', tier: 'bronze', name: 'Film night' },
        { id: 'r3', tier: 'silver', name: 'Dinner out' },
        { id: 'r4', tier: 'silver', name: 'Drinks with friends' },
        { id: 'r5', tier: 'gold', name: 'Big night out' },
        { id: 'r6', tier: 'gold', name: 'Treat yourself to something' }
      ],
      quests: {},
      plans: {},
      journal: {},
      sleep: [],
      sleepTarget: { hours: 8, bedtime: '23:00' },
      stats: { str: 0, int: 0, agi: 0, per: 0, vit: 0 },
      title: null,
      titles: {},
      strict: false,
      penalties: {},
      penaltyPool: ['100 push-ups (sets allowed)', '20-minute run', 'Cold shower, 2 minutes', '1 hour with the phone in another room', '100 squats (sets allowed)', 'Clean and reset your room'],
      emergencies: [],
      emRoll: 0,
      shop: [
        { id: 's1', name: 'Favourite takeaway', price: 250 },
        { id: 's2', name: 'New game or film', price: 600 },
        { id: 's3', name: 'Lazy morning, no alarm', price: 400 }
      ],
      achievements: {},
      lastExport: 0,
      seenLevel: 1
    };
  }

  function allTasks(state) { return TASKS.concat(state.customTasks || []); }

  function clampCustomXp(xp) {
    const n = Math.round(Number(xp) || 0);
    return Math.min(CUSTOM_MAX, Math.max(CUSTOM_MIN, n));
  }

  function runLength(set, fromDay) {
    let n = 0;
    while (set.has(fromDay - n)) n++;
    return n;
  }

  /* Replays the event log into every derived number the app shows. */
  function compute(state, now) {
    now = now || Date.now();
    const events = state.events.slice().sort((a, b) => a.ts - b.ts);
    const taskDays = {};
    CATS.forEach(c => { taskDays[c.id] = new Set(); });
    const loggedByDay = {};
    events.forEach(e => {
      if (e.type !== 'task') return;
      const di = dayIndex(e.ts);
      if (taskDays[e.cat]) taskDays[e.cat].add(di);
      const dk = dayKey(e.ts);
      (loggedByDay[dk] = loggedByDay[dk] || new Set()).add(e.taskId);
    });

    // Quest bonuses become synthetic events at the moment the last quest task was logged.
    const timeline = events.slice();
    const questDone = {};
    Object.keys(state.quests || {}).forEach(dk => {
      const ids = state.quests[dk];
      const logged = loggedByDay[dk];
      if (!ids || !ids.length || !logged || !ids.every(id => logged.has(id))) return;
      questDone[dk] = true;
      const lastTs = Math.max.apply(null, events
        .filter(e => e.type === 'task' && dayKey(e.ts) === dk && ids.indexOf(e.taskId) >= 0)
        .map(e => e.ts));
      timeline.push({ id: 'quest-' + dk, ts: lastTs + 0.5, type: 'quest', day: dk });
    });
    Object.keys(state.journal || {}).forEach(dk => {
      const j = state.journal[dk];
      if (j && j.ts) timeline.push({ id: 'journal-' + dk, ts: j.ts, type: 'journal', day: dk, title: j.title || null });
    });
    timeline.sort((a, b) => a.ts - b.ts);

    // A day's plan is complete when it has items and every one is ticked.
    const planDone = {};
    Object.keys(state.plans || {}).forEach(dk => {
      const items = (state.plans[dk] && state.plans[dk].items) || [];
      if (items.length && items.every(i => i.done)) planDone[dk] = true;
    });
    const planExtra = {};

    // Emergency quests missed by midnight (new rules only) cut that day's task XP by 30% each.
    const emFail = {}, emergencyLost = {};
    (state.emergencies || []).forEach(em => {
      if (em.eod && !em.doneAt && now >= em.expiresAt) { const k = dayKey(em.issuedAt); emFail[k] = (emFail[k] || 0) + 1; }
    });

    let total = 0;
    const catXp = {};
    CATS.forEach(c => { catXp[c.id] = 0; });
    const weekXp = {};
    const earned = {};
    let lastSlip = 0, firstTs = 0, photos = 0, claims = 0, lootCount = 0, jackpots = 0, frenzyUntil = 0;
    let goldEarned = 0, goldSpent = 0, journalCount = 0, emergencyDone = 0, penaltyLost = 0;
    const penalties = state.penalties || {};

    timeline.forEach(e => {
      let x = 0;
      if (e.type === 'task') {
        const prior = runLength(taskDays[e.cat] || new Set(), dayIndex(e.ts) - 1);
        const cap = e.title === 'relentless' ? 7 : STREAK_MAX_DAYS;
        const bonus = Math.min(prior, cap) * STREAK_STEP;
        x = Math.round((e.base || 0) * (1 + bonus));
        const pct = (e.statPct || 0) + titlePct(e);
        if (pct) x = Math.round(x * (1 + pct / 100));
        if (e.fatigue) x = Math.round(x * (1 - e.fatigue / 100));
        if (frenzyUntil > e.ts) x = Math.round(x * FRENZY_MULT);
        x = applyLoot(x, e.loot);
        const dk = dayKey(e.ts);
        if (planDone[dk]) { planExtra[dk] = (planExtra[dk] || 0) + x; x *= PLAN_MULT; }
        const pen = penalties[dk];
        if (pen && !e.sleepId && e.ts >= (pen.issuedAt || 0) - DAY && (!pen.doneAt || e.ts < pen.doneAt) &&
            !(e.title === 'strategist' && e.ts > (pen.issuedAt || 0) + 3 * 3600000)) {
          const cut = x - Math.round(x * (e.title === 'penitent' ? 0.75 : 0.5));
          x -= cut; penaltyLost += cut;
        }
        if (emFail[dk] && x > 0) {
          const cut = x - Math.round(x * Math.pow(1 - EM_MISS_CUT, emFail[dk]));
          x -= cut; emergencyLost[dk] = (emergencyLost[dk] || 0) + cut;
        }
        if (e.emergency) emergencyDone++;
        if (e.loot) {
          lootCount++;
          if (e.loot.kind === 'jackpot') jackpots++;
          if (e.loot.kind === 'frenzy') frenzyUntil = Math.max(frenzyUntil, e.loot.until || 0);
        }
        if (!firstTs) firstTs = e.ts;
        if (e.photoId) photos++;
      } else if (e.type === 'slip') {
        x = -(e.title === 'iron' ? 3 : SLIP_XP);
        lastSlip = e.ts;
        if (!firstTs) firstTs = e.ts;
      } else if (e.type === 'quest') {
        x = QUEST_BONUS;
      } else if (e.type === 'journal') {
        x = e.title === 'chronicler' ? 25 : JOURNAL_XP;
        journalCount++;
      } else if (e.type === 'buy') {
        goldSpent += e.price || 0;
      } else if (e.type === 'claim') {
        claims++;
      }
      earned[e.id] = x;
      if (x > 0) goldEarned += Math.floor((x / 10) * (e.title === 'gold-hunter' ? 1.2 : 1));
      total = Math.max(0, total + x);
      if (e.cat && catXp[e.cat] !== undefined) catXp[e.cat] = Math.max(0, catXp[e.cat] + x);
      const wk = weekKey(e.ts);
      weekXp[wk] = Math.max(0, (weekXp[wk] || 0) + x);
    });

    const today = dayIndex(now);
    const cats = {};
    let bestStreak = 0;
    CATS.forEach(c => {
      const set = taskDays[c.id];
      let cur = runLength(set, today);
      if (!cur) cur = runLength(set, today - 1);
      let best = 0;
      set.forEach(d => {
        if (set.has(d - 1)) return;
        let n = 0;
        while (set.has(d + n)) n++;
        best = Math.max(best, n);
      });
      bestStreak = Math.max(bestStreak, best);
      cats[c.id] = Object.assign({ xp: catXp[c.id], streak: cur, best }, levelInfo(catXp[c.id]));
    });

    const wk = weekKey(now);
    return Object.assign(levelInfo(total), {
      total,
      cats,
      weekXp,
      thisWeek: weekXp[wk] || 0,
      lastWeek: weekXp[prevWeekKey(now)] || 0,
      earned,
      questDone,
      bestStreak,
      lastSlip,
      firstTs,
      photos,
      claims,
      lootCount,
      jackpots,
      frenzyUntil,
      planDone,
      planExtra,
      goldEarned,
      goldSpent,
      gold: Math.max(0, goldEarned - goldSpent),
      journalCount,
      emergencyDone,
      penaltyLost,
      emFail,
      emergencyLost,
      penaltiesCleared: Object.keys(penalties).filter(k => penalties[k].doneAt && !penalties[k].passed).length,
      sleepInfo: sleepSummary(state),
      rank: rankFor(levelInfo(total).level),
      points: statPoints(state, levelInfo(total).level)
    });
  }

  function tiersReached(xp) { return TIERS.filter(t => xp >= t.xp); }

  function nextTier(xp) { return TIERS.find(t => xp < t.xp) || null; }

  /* Rewards unlocked this week or last week (last week's expire at the end of this one). */
  function claimable(state, comp, now) {
    now = now || Date.now();
    const out = [];
    [[weekKey(now), comp.thisWeek], [prevWeekKey(now), comp.lastWeek]].forEach(([wk, xp]) => {
      const reached = tiersReached(xp).map(t => t.id);
      state.rewards.forEach(r => {
        if (reached.indexOf(r.tier) < 0) return;
        const done = state.events.some(e => e.type === 'claim' && e.rewardId === r.id && e.week === wk);
        if (!done) out.push({ reward: r, week: wk, lastWeek: wk !== weekKey(now) });
      });
    });
    return out;
  }

  /* Deterministic pick of three quest tasks for a day, spread across categories. */
  function pickQuests(tasks, dk) {
    let seed = 0;
    for (let i = 0; i < dk.length; i++) seed = (seed * 31 + dk.charCodeAt(i)) >>> 0;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const pool = tasks.filter(t => t.xp > 0).slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const picked = [], usedCats = new Set();
    pool.forEach(t => { if (picked.length < 3 && !usedCats.has(t.cat)) { picked.push(t.id); usedCats.add(t.cat); } });
    pool.forEach(t => { if (picked.length < 3 && picked.indexOf(t.id) < 0) picked.push(t.id); });
    return picked;
  }

  function ensureQuests(state, now) {
    const dk = dayKey(now || Date.now());
    if (!state.quests[dk]) { state.quests[dk] = pickQuests(allTasks(state), dk); return true; }
    return false;
  }

  const ACHIEVEMENTS = [

  /* Records newly earned achievements; earned ones are kept even if events are undone. */
  function checkAchievements(state, comp, now) {
    now = now || Date.now();
    const fresh = [];

      if (!state.achievements[a.id] && a.test(comp, state, now)) { state.achievements[a.id] = now; fresh.push(a); }

  const TRIGGERS = [
    { id: 'bored', name: 'Bored' },

  ];
  const TIMES = [
    { id: 'morning', name: 'Morning (5–12)' },
    { id: 'afternoon', name: 'Afternoon (12–5)' },
    { id: 'evening', name: 'Evening (5–10)' },

  const WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

  function timeOfDay(ts) {
    const hr = new Date(ts).getHours();
    if (hr >= 5 && hr < 12) return 'morning';
    if (hr >= 12 && hr < 17) return 'afternoon';
    if (hr >= 17 && hr < 22) return 'evening';
    return 'night';
  }
  const weekday = ts => (new Date(ts).getDay() + 6) % 7; // 0 = Monday
  function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function topKey(list) {
    let best = null;
    list.forEach(x => { if (x.count > 0 && (!best || x.count > best.count)) best = x; });
    return best ? best.id : null;
  }

  /* Everything the Stats screen charts, derived from the event log. */
  function stats(state, comp, now) {
    now = now || Date.now();
    const today0 = startOfDay(now);

    const dayXp = {};
    state.events.forEach(e => {
      const k = dayKey(e.ts);
      dayXp[k] = (dayXp[k] || 0) + (comp.earned[e.id] || 0);
    });
    Object.keys(comp.questDone).forEach(k => { dayXp[k] = (dayXp[k] || 0) + QUEST_BONUS; });

    const weeks = [];
    for (let i = 7; i >= 0; i--) {
      const key = weekKey(weekStart(now) - i * 7 * DAY + DAY / 2);
      weeks.push({ key, xp: comp.weekXp[key] || 0 });
    }

    const days = [];
    for (let i = 13; i >= 0; i--) {
      const ts = startOfDay(today0 - i * DAY + DAY / 2);
      const key = dayKey(ts);
      days.push({ key, ts, xp: Math.max(0, dayXp[key] || 0) });
    }

    const since30 = now - 30 * DAY, since7 = today0 - 6 * DAY;
    const cats = CATS.map(c => ({ id: c.id, xp: 0, count: 0 }));
    const recent = new Set();
    state.events.forEach(e => {
      if (e.type !== 'task') return;
      if (e.ts >= since30) {
        const c = cats.find(x => x.id === e.cat);
        if (c) { c.xp += comp.earned[e.id] || 0; c.count++; }
      }
      if (e.ts >= since7) recent.add(e.cat);
    });
    const neglected = CATS.map(c => c.id).filter(id => !recent.has(id));

    // Average XP per weekday over the last 8 weeks (only days that have happened).
    const sums = [0, 0, 0, 0, 0, 0, 0], counts = [0, 0, 0, 0, 0, 0, 0];
    const first = state.events.length ? startOfDay(Math.min.apply(null, state.events.map(e => e.ts))) : today0;
    const from = Math.max(first, weekStart(now) - 7 * 7 * DAY);
    for (let ts = from; ts <= today0 + DAY / 2; ts = startOfDay(ts + DAY * 1.5)) {
      const w = weekday(ts);
      sums[w] += Math.max(0, dayXp[dayKey(ts)] || 0);
      counts[w]++;
    }
    const weekdayAvg = sums.map((s, i) => (counts[i] ? Math.round(s / counts[i]) : 0));
    let bestDay = null;
    weekdayAvg.forEach((v, i) => { if (v > 0 && (bestDay === null || v > weekdayAvg[bestDay])) bestDay = i; });

    const slips = state.events.filter(e => e.type === 'slip' && e.ts >= since30);
    const byTrigger = TRIGGERS.map(t => ({ id: t.id, name: t.name, count: 0 }))
      .concat([{ id: 'none', name: 'Not recorded', count: 0 }]);
    const byTime = TIMES.map(t => ({ id: t.id, name: t.name, count: 0 }));
    const byWeekday = WEEKDAYS.map((n, i) => ({ id: i, name: n, count: 0 }));
    const habitMap = {};
    slips.forEach(e => {
      (byTrigger.find(x => x.id === e.trigger) || byTrigger[byTrigger.length - 1]).count++;
      byTime.find(x => x.id === timeOfDay(e.ts)).count++;
      byWeekday[weekday(e.ts)].count++;
      habitMap[e.name] = (habitMap[e.name] || 0) + 1;
    });
    const byHabit = Object.keys(habitMap).map(n => ({ name: n, count: habitMap[n] })).sort((a, b) => b.count - a.count);

    return {
      weeks, days, cats, neglected, weekdayAvg, bestDay,
      slips: {
        total: slips.length,
        xpLost: slips.length * SLIP_XP,
        byTrigger, byTime, byWeekday, byHabit,
        topTrigger: topKey(byTrigger.filter(x => x.id !== 'none')),
        topTime: topKey(byTime),
        topDay: topKey(byWeekday)
      }
    };
  }

  /* ================= The System ================= */
  const RANKS = [
    { id: 'E', min: 1 }, { id: 'D', min: 5 }, { id: 'C', min: 10 },
    { id: 'B', min: 20 }, { id: 'A', min: 35 }, { id: 'S', min: 50 }
  ];
  function rankFor(level) { let r = RANKS[0]; RANKS.forEach(x => { if (level >= x.min) r = x; }); return r.id; }

  const STATS = [
    { id: 'str', abbr: 'STR', name: 'Strength', cat: 'fitness' },
    { id: 'int', abbr: 'INT', name: 'Intelligence', cat: 'study' },
    { id: 'agi', abbr: 'AGI', name: 'Agility', cat: 'productivity' },
    { id: 'per', abbr: 'PER', name: 'Perception', cat: 'work' },
    { id: 'vit', abbr: 'VIT', name: 'Vitality', cat: 'sleep' }
  ];
  const POINTS_PER_LEVEL = 3;
  function statPoints(state, level) {
    const total = (level - 1) * POINTS_PER_LEVEL;
    const spent = STATS.reduce((a, s) => a + ((state.stats && state.stats[s.id]) || 0), 0);
    return { total, spent, free: Math.max(0, total - spent) };
  }
  function statFor(cat) { return STATS.find(s => s.cat === cat); }

  /* Percentage bonuses from the title equipped when the entry was logged. */
  function titlePct(e) {
    let p = 0;
    if (e.title === 'polymath') p += 3;
    if (e.title === 'juggernaut' && e.cat === 'fitness') p += 5;
    if (e.title === 'scholar' && e.cat === 'study') p += 5;
    if (e.title === 'dawn' && new Date(e.ts).getHours() < 9) p += 10;
    if (e.title === 'first-responder' && e.emergency) p += 25;
    return p;
  }

  /* ---- sleep ---- */
  function bedMinutes(ts) { const d = new Date(ts); return ((d.getHours() * 60 + d.getMinutes()) - 18 * 60 + 1440) % 1440; }
  function hhmmMinutes(hhmm) { const [h, m] = String(hhmm || '23:00').split(':').map(Number); return ((h * 60 + (m || 0)) - 18 * 60 + 1440) % 1440; }
  function asleepHours(en) { return Math.max(0, (en.wake - en.bed) / 3600000 - (en.latency || 0) / 60); }
  function bedOnTime(en) { return bedMinutes(en.bed) <= hhmmMinutes(en.targetBed || '23:00'); }
  function sleepXp(en) {
    const h = asleepHours(en);
    let x = h >= 7 && h <= 9 ? 30 : h > 9 ? 15 : h >= 6 ? 10 : 0;
    if (bedOnTime(en)) x += 10;
    if ((en.feel || 0) >= 4) x += 5;
    return x;
  }
  function sleepFatigue(en) {
    const short = Math.max(0, (en.targetHours || 8) - asleepHours(en));
    let f = short * 6;
    if (en.feel <= 2) f += 6; else if (en.feel === 3) f += 2;
    const late = bedMinutes(en.bed) - hhmmMinutes(en.targetBed || '23:00');
    if (late > 0) f += Math.min(6, Math.floor(late / 30) * 2);
    return Math.max(0, Math.min(20, Math.round(f)));
  }
  function currentFatigue(state, now) {
    const dk = dayKey(now || Date.now());
    const en = (state.sleep || []).filter(x => dayKey(x.wake) === dk).sort((a, b) => b.wake - a.wake)[0];
    return en ? sleepFatigue(en) : 0;
  }
  function sleepSummary(state) {
    const list = (state.sleep || []).slice().sort((a, b) => a.wake - b.wake);
    let dawn = 0, run = 0, bestRun = 0, prevDay = null;
    list.forEach(en => {
      if (bedOnTime(en)) dawn++;
      const di = dayIndex(en.wake), h = asleepHours(en), good = h >= 7 && h <= 9;
      if (good && prevDay !== null && di === prevDay + 1 && run > 0) run++;
      else run = good ? 1 : 0;
      prevDay = di;
      bestRun = Math.max(bestRun, run);
    });
    return { nights: list.length, dawn, bestRun };
  }

  /* Values stamped onto an entry when it's logged, so later changes never rewrite history. */
  function stamp(state, ev, now) {
    ev.title = state.title || null;
    const st = statFor(ev.cat);
    ev.statPct = st ? ((state.stats && state.stats[st.id]) || 0) : 0;
    if (!ev.sleepId) {
      let f = currentFatigue(state, now || ev.ts);
      if (state.title === 'well-rested') f = Math.min(f, 5);
      ev.fatigue = f;
    }
    return ev;
  }
  function lootChance(state) { return state.title === 'lucky' ? 0.18 : LOOT_CHANCE; }

  /* ---- journal ---- */

    const y = dayKey(new Date(now).setHours(12, 0, 0, 0) - DAY);
    if (!comp.firstTs || comp.firstTs >= new Date(now).setHours(0, 0, 0, 0)) return false; // nothing before today
    const items = (state.plans[y] && state.plans[y].items) || [];
    let failed = items.length > 0 && !comp.planDone[y];
    if (state.strict && (!items.length || !(state.journal && state.journal[y]))) failed = true;
    if (!failed) return false;
    const pool = state.penaltyPool && state.penaltyPool.length ? state.penaltyPool : ['20-minute run'];
    let seed = 7;
    for (let i = 0; i < dk.length; i++) seed = (seed * 31 + dk.charCodeAt(i)) >>> 0;
    state.penalties[dk] = { quest: pool[seed % pool.length], issuedAt: now, doneAt: null, passed: false, reason: items.length ? 'plan' : 'strict' };
    return true;

  const EM_PER_DAY = 2, EM_GAP_MS = 3600000, EM_CHANCE = 0.33, EM_MISS_CUT = 0.3;
  function activeEmergency(state, now) {

  function maybeEmergency(state, now, rand) {
    now = now || Date.now(); rand = rand || Math.random;
    const hr = new Date(now).getHours();
    if (hr < 8 || hr >= 21) return null;
    if (activeEmergency(state, now)) return null;

    if ((state.emergencies || []).filter(e => dayKey(e.issuedAt) === dk).length >= EM_PER_DAY) return null;

    state.emRoll = now;

    const q = EMERGENCY_POOL[Math.floor(rand() * EMERGENCY_POOL.length)];

    const em = { id: 'em-' + now.toString(36), text: q.text, cat: q.cat, xp: q.xp, issuedAt: now, expiresAt: midnight.getTime(), doneAt: null, eod: true };
    (state.emergencies = state.emergencies || []).push(em);

  }

  /* ---- gold shop ---- */

  /* ---------- charts (hand-drawn SVG) ---------- */
  function columns(data, opts) {
    const W = 320, H = 150, padB = 20, padT = 12, gap = 4, n = data.length;
    const max = Math.max(opts.min || 1, ...data.map(d => d.value)) * 1.08;
    const bw = (W - gap * (n - 1)) / n, y0 = H - padB;
    let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${opts.label}">`;
    (opts.lines || []).forEach(l => {
      if (l.value > max) return;
      const y = padT + (y0 - padT) * (1 - l.value / max);
      svg += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="ref"/><text x="${W}" y="${y - 3}" text-anchor="end" class="reft">${l.label}</text>`;
    });
    data.forEach((d, i) => {
      const hgt = (y0 - padT) * (Math.max(0, d.value) / max), x = i * (bw + gap);
      svg += `<rect x="${x}" y="${y0 - hgt}" width="${bw}" height="${hgt}" class="${d.hl ? 'hl' : 'col'}"/>`;
      if (d.label) svg += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" class="lbl">${d.label}</text>`;
    });
    svg += `<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" class="base"/></svg>`;
    const wrap = h('div');
    wrap.innerHTML = svg;
    return wrap;
  }
  function hbars(rows, f) {
    const max = Math.max(1, ...rows.map(r => r.value));

      bar(r.value / max, { thin: true, color: r.color }))));
  }

  async function compress(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
      const scale = Math.min(1, 1080 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), ht = Math.round(img.naturalHeight * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = ht;
      c.getContext('2d').drawImage(img, 0, 0, w, ht);
      return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
    } finally { URL.revokeObjectURL(url); }
  }
  document.getElementById('photoInput').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];

    if (!file || !ev) return;
    try {
      const blob = await compress(file);
      if (!blob) throw new Error('encode');
      const pid = 'p-' + uid();
      await photoPut(pid, blob);
      if (ev.photoId) photoDel(ev.photoId).catch(() => {});
      ev.photoId = pid;
      commit({ quiet: true });
      toast(h('span', null, ic('camera'), ' Photo added to “' + ev.name + '”.'));

  async function dataURLToBlob(u) { return (await fetch(u)).blob(); }
  async function saveFile(filename, text) {

        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: text }); return true; }
      } catch (e) {
        if (e && e.code === 'declined') return false;
      }
    }
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: filename });

    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;

  function dayView(dk) {

    if (isToday) status = complete ? 'Complete. Double XP on every task today' + (comp.planExtra[dk] ? ': +' + fmt(comp.planExtra[dk]) + ' XP so far.' : '.')
      : items.length ? 'Finish all ' + items.length + ' to double today’s XP, including what you’ve already logged.'

    J_FIELDS.forEach(f => { inputs[f.id] = h('textarea', { placeholder: f.ph, maxlength: 1500, 'aria-label': f.label }); inputs[f.id].value = (j && j[f.id]) || ''; });
    return win(title,
      h('p', { class: 'small muted' }, 'Present your day before you sleep. You have until 4am. Fill in at least one prompt.'),
      h('div', { class: 'field' }, h('label', { class: 'lab' }, 'Mood (1 rough, 5 superb)'), moodBox),
      J_FIELDS.map(f => h('div', { class: 'field' }, h('label', { class: 'lab' }, f.label), inputs[f.id])),
      h('div', { class: 'btns' },
        h('button', { class: 'btn gold', onclick: () => {
          const entry = { mood };
          J_FIELDS.forEach(f => { entry[f.id] = inputs[f.id].value.trim(); });
          if (!J_FIELDS.some(f => entry[f.id])) { toast('Write at least one line first, sir.'); return; }
          const first = !j;
          entry.ts = j ? j.ts : Date.now();
          entry.title = j ? j.title : (state.title || null);
          state.journal[dk] = entry;
          journalEditing = null;
          commit();
          toast(first ? '+' + (comp.earned['journal-' + dk] || E.JOURNAL_XP) + ' XP. Journal presented.' : 'Journal updated.');
        } }, ic('check'), j ? 'Save changes' : 'Present journal'),
        j ? h('button', { class: 'btn ghost', onclick: () => { journalEditing = null; render(); } }, 'Cancel') : null));
  }

  /* ---------- render & routing ---------- */
  function icons() { if (window.lucide && window.lucide.createIcons) { try { window.lucide.createIcons(); } catch (e) { /* icons optional */ } } }
  function renderTabs() {
    const box = document.getElementById('tabs');
    box.replaceChildren(...VIEWS.map(v => h('button', { 'aria-current': v.id === view ? 'page' : null, onclick: () => { if (v.id === 'plan' && view === 'plan') planDay = null; go(v.id); if (v.id === 'plan') render(); } }, ic(v.icon), v.short || v.name)));
  }
  function render() {
    const today = new Date().toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    app.replaceChildren(
      h('header', { class: 'topbar' }, h('h1', null, VIEWS.find(v => v.id === view).name),
        h('div', { class: 'right' }, h('span', { class: 'date' }, today),
          h('button', { class: 'skinbtn', 'aria-label': 'Change theme', onclick: openSkins }, ic('palette')))),
      ...views[view]().filter(Boolean));
    renderTabs();
    icons();
  }
  function go(id, fromHash) {
    if (id === 'habits') { logSub = 'habits'; id = 'log'; }
    if (id === 'rewards') id = 'shop';
    if (!views[id] || id === 'habits' || id === 'rewards') id = 'character';
    const changed = id !== view;
    view = id;
    if (!fromHash) { try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } }
    render();
    if (changed) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => go(location.hash.slice(1), true));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) systemTick(); });

  if (E.ensureQuests(state, Date.now())) save();
  comp = E.compute(state);
  E.checkAchievements(state, comp, Date.now());
  go(location.hash.slice(1) || 'character', true);
  state.seenRank = state.seenRank || comp.rank;
  E.checkTitles(state, comp, Date.now());
  setTimeout(systemTick, 600);
  if (!window.lucide) window.addEventListener('load', icons);

  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
<script>
/* Digital rain behind the windows. Drawn in code; pauses when hidden or when reduced motion is on. */
(function () {
  const c = document.getElementById('rain');
  if (!c || !c.getContext || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const g = c.getContext('2d');
  const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789';
  const fs = 16;
  let w = 0, ht = 0, drops = [];
  function size() {
    const d = window.devicePixelRatio || 1;
    w = innerWidth; ht = innerHeight;
    c.width = w * d; c.height = ht * d;
    g.setTransform(d, 0, 0, d, 0, 0);
    drops = Array.from({ length: Math.ceil(w / fs) }, () => Math.random() * -60);
  }
  size();
  addEventListener('resize', size);
  let last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (document.hidden || t - last < 75) return;
    last = t;
    g.fillStyle = 'rgba(0, 3, 0, 0.16)';
    g.fillRect(0, 0, w, ht);
    g.font = fs + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const y = drops[i] * fs;
      g.fillStyle = Math.random() < 0.035 ? '#ff2a4d' : '#00ff66';
      g.fillText(glyphs[(Math.random() * glyphs.length) | 0], i * fs, y);
      if (y > ht && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  requestAnimationFrame(frame);
})();
</script>
